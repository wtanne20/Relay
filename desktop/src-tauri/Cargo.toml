[package]
name = "relay-desktop"
version = "1.0.9"
description = "Relay desktop app (Windows and Linux): runs the Relay server in the background and gives it a desktop window"
edition = "2024"

[[bin]]
name = "relay-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
relay = { path = "../../server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true

# Dev builds: optimize dependencies (TLS, HTTP, tokio) so downloads and
# llama-server traffic run at full speed; Relay's own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3
