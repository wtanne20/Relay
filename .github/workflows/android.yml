name: Android app

# Builds installable APKs for Android phones (no Expo account needed):
#  - Relay.apk      the normal app
#  - Relay-Dev.apk  a development build ("Relay Dev") that loads the app's code
#                   live from Metro on your PC; see DEVELOPING.md
# It is signed with the Android debug key, which is fine for installing on
# your own phone: download the artifact, open it on the phone and allow
# "install unknown apps" when asked.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Replace the APKs on this existing release (e.g. v1.0.3); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            artifact: Relay-android
            apk: Relay.apk
            gradle_task: assembleRelease
            output: release/app-release.apk
          - variant: dev
            artifact: Relay-Dev-android
            apk: Relay-Dev.apk
            gradle_task: assembleDebug
            output: debug/app-debug.apk
    env:
      APP_VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew ${{ matrix.gradle_task }} --no-daemon

      - name: Rename
        run: cp android/app/build/outputs/apk/${{ matrix.output }} ${{ matrix.apk }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: mobile/${{ matrix.apk }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: mobile/${{ matrix.apk }}
          overwrite_files: true
