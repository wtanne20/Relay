name: Linux desktop

# Builds the full Relay desktop app (brain + native window) for Linux, on
# native runners for each architecture (Tauri can't cross-compile):
#
# - x64: a .deb and an .AppImage, plus the x86_64 host zip.
# - arm64: a .deb, for Proot on an Android phone (Debian or Ubuntu shown
#   through Termux:X11 or VNC). Built on Ubuntu 22.04 so its glibc (2.35)
#   is old enough for Debian 12 and Ubuntu 22.04+ Proot images. No AppImage:
#   Proot has no FUSE to mount one.
#
# One app for every Linux desktop: on first launch it asks whether this
# computer is the brain (model, agent, history run here, like on Windows) or
# a computer linked to a brain elsewhere on the tailnet (it shares its files;
# the brain does the thinking).

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "desktop/**"
      - "mobile/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "server/**"
      - "desktop/**"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            bundles: deb,appimage
          - arch: arm64
            runner: ubuntu-22.04-arm
            bundles: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            desktop/src-tauri/target
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('server/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-${{ matrix.arch }}-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            desktop/package-lock.json

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            file \
            zip \
            pkg-config

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && matrix.arch == 'amd64' }}
        working-directory: server
        run: cargo test --locked

      - name: Install mobile deps (for the web UI bundle)
        working-directory: mobile
        run: npm ci

      - name: Build relay-desktop (Tauri)
        working-directory: desktop
        run: |
          npm ci
          # The target cache keeps old versions' bundles; start clean so the
          # copy below finds exactly this version's files.
          rm -rf src-tauri/target/release/bundle
          npx tauri build --bundles ${{ matrix.bundles }}
          ls -la src-tauri/target/release/bundle/*/

      - name: Build relay host (x86_64 Linux "hands")
        if: matrix.arch == 'amd64'
        # The runner is x86_64, so this is a native build. The same binary
        # that runs the brain also has the `host` subcommand — on a linked
        # Linux PC it's started as `relay host` to expose its files + shell
        # to the Windows brain (the AI reads/edits this PC's files).
        working-directory: server
        run: cargo build --release --locked

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' server/Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          v=${{ steps.version.outputs.version }}
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/Relay-$v-${{ matrix.arch }}.deb
          if [ "${{ matrix.arch }}" = amd64 ]; then
            cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/Relay-$v-x86_64.AppImage
            # The x86_64 host (like the aarch64 one): relay binary + install.sh + start + pwa.
            HOST=dist/relay-host-x86_64-linux
            mkdir -p "$HOST"
            cp server/target/release/relay "$HOST/relay"
            cp dev/proot-install.sh "$HOST/install.sh"
            cp dev/pwa.sh "$HOST/pwa"
            printf '#!/bin/sh\nexec "$(dirname "$0")/relay" link "$@"\n' > "$HOST/start"
            chmod +x "$HOST/relay" "$HOST/install.sh" "$HOST/pwa" "$HOST/start"
            (cd "$HOST" && zip -q ../relay-host-x86_64-linux.zip relay install.sh start pwa)
            rm -rf "$HOST"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: RelayLinux-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
