name: Linux desktop (x64)

# Builds the full Relay desktop app (brain + native window) for x64 Linux.
# Tauri can't cross-compile from Windows, so this runs on a Linux runner.
# Produces a .deb and an .AppImage — the two standard Linux desktop formats.
#
# This is the "full" Linux release: the brain (model, agent, history) runs
# locally, exactly like the Windows app. (The aarch64 Proot box is different —
# that one is hands-only and uses the PWA.)

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "desktop/**"
      - "client/**"
      - "mobile/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "server/**"
      - "desktop/**"
      - "client/**"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('server/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            desktop/package-lock.json

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            file \
            zip \
            pkg-config

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: server
        run: cargo test --locked

      - name: Install mobile deps (for the web UI bundle)
        working-directory: mobile
        run: npm ci

      - name: Build relay-desktop (Tauri, .deb + .AppImage)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
          ls -la src-tauri/target/release/bundle/deb/*.deb
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Build relay host (x86_64 Linux "hands")
        # The runner is x86_64, so this is a native build. The same binary
        # that runs the brain also has the `host` subcommand — on a linked
        # Linux PC it's started as `relay host` to expose its files + shell
        # to the Windows brain (the AI reads/edits this PC's files).
        working-directory: server
        run: cargo build --release --locked

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' server/Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the Relay Client app (GUI, "install and go")
        # A small Tauri window: enter the brain's address + token once, click
        # Connect. It starts this machine's host (exposing its files + shell),
        # pairs it with the brain, and opens the UI. No terminal needed.
        # The relay binary is bundled inside the app (as a resource).
        run: |
          mkdir -p client/src-tauri/resources
          cp server/target/release/relay client/src-tauri/resources/relay
          chmod +x client/src-tauri/resources/relay
          cd client
          npm ci
          npx tauri build --bundles deb,appimage
          ls -la src-tauri/target/release/bundle/deb/*.deb
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage
          cd ..

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/Relay-${{ steps.version.outputs.version }}-amd64.deb
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/Relay-${{ steps.version.outputs.version }}-x86_64.AppImage
          cp client/src-tauri/target/release/bundle/deb/*.deb dist/RelayClient-${{ steps.version.outputs.version }}-amd64.deb
          cp client/src-tauri/target/release/bundle/appimage/*.AppImage dist/RelayClient-${{ steps.version.outputs.version }}-x86_64.AppImage
          # The x86_64 host (like the aarch64 one): relay binary + install.sh + start + pwa.
          HOST=dist/relay-host-x86_64-linux
          mkdir -p "$HOST"
          cp server/target/release/relay "$HOST/relay"
          cp dev/proot-install.sh "$HOST/install.sh"
          cp dev/pwa.sh "$HOST/pwa"
          printf '#!/bin/sh\nexec "$(dirname "$0")/relay" host --bind 0.0.0.0:8766 --root "${RELY_ROOT:-$HOME}" "$@"\n' > "$HOST/start"
          chmod +x "$HOST/relay" "$HOST/install.sh" "$HOST/pwa" "$HOST/start"
          (cd "$HOST" && zip -q ../relay-host-x86_64-linux.zip relay install.sh start pwa)
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: RelayLinux-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Relay-${{ steps.version.outputs.version }}-amd64.deb
            dist/Relay-${{ steps.version.outputs.version }}-x86_64.AppImage
            dist/RelayClient-${{ steps.version.outputs.version }}-amd64.deb
            dist/RelayClient-${{ steps.version.outputs.version }}-x86_64.AppImage
            dist/relay-host-x86_64-linux.zip
