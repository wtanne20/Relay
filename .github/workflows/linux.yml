name: Linux desktop (x64)

# Builds the full Relay desktop app (brain + native window) for x64 Linux.
# Tauri can't cross-compile from Windows, so this runs on a Linux runner.
# Produces a .deb and an .AppImage — the two standard Linux desktop formats.
#
# This is the "full" Linux release: the brain (model, agent, history) runs
# locally, exactly like the Windows app. (The aarch64 Proot box is different —
# that one is hands-only and uses the PWA.)

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "desktop/**"
      - "mobile/**"
      - ".github/workflows/linux.yml"
  pull_request:
    paths:
      - "server/**"
      - "desktop/**"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('server/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            desktop/package-lock.json

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            file \
            pkg-config

      - name: Test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: server
        run: cargo test --locked

      - name: Install mobile deps (for the web UI bundle)
        working-directory: mobile
        run: npm ci

      - name: Build relay-desktop (Tauri, .deb + .AppImage)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
          ls -la src-tauri/target/release/bundle/deb/*.deb
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' server/Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/Relay-${{ steps.version.outputs.version }}-amd64.deb
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/Relay-${{ steps.version.outputs.version }}-x86_64.AppImage
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: RelayLinux-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Relay-${{ steps.version.outputs.version }}-amd64.deb
            dist/Relay-${{ steps.version.outputs.version }}-x86_64.AppImage
