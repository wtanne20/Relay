name: Windows installer

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "desktop/**"
      - "mobile/**"
      - "installer/**"
      - "README.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "server/**"
      - "desktop/**"
      - "mobile/**"
      - "installer/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
            desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('server/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          # A version bump changes the lockfiles; start from the last build
          # instead of compiling everything from scratch.
          restore-keys: |
            windows-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            desktop/package-lock.json

      - name: Test
        working-directory: server
        run: cargo test --locked

      - name: Build relay.exe
        working-directory: server
        run: cargo build --release --locked

      - name: Build the desktop app (relay-desktop.exe)
        run: |
          Push-Location mobile; npm ci; Pop-Location
          Push-Location desktop; npm ci; npx tauri build --no-bundle; Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path desktop\src-tauri\target\release\relay-desktop.exe)) { throw "relay-desktop.exe was not built" }

      - name: Read version
        id: version
        run: |
          $v = (Select-String -Path server/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\relay.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the installer
        timeout-minutes: 10
        run: |
          # Wait on the setup process itself (not its whole process tree) with a timeout,
          # and keep Inno Setup's logs so a failure shows where it stopped.
          function Run-Setup($exe, $argList, $log) {
            Write-Host "Running $exe $argList"
            $p = Start-Process $exe -ArgumentList ($argList + "/LOG=`"$log`"") -PassThru
            $null = $p.Handle  # keep the handle so ExitCode is available after exit
            if (-not $p.WaitForExit(300000)) {
              if (Test-Path $log) { Get-Content $log }
              throw "$exe did not finish within 5 minutes"
            }
            if ($p.ExitCode -ne 0) {
              if (Test-Path $log) { Get-Content $log }
              throw "$exe exited with $($p.ExitCode)"
            }
          }
          $setup = Get-ChildItem installer\Output\RelaySetup-*.exe | Select-Object -First 1
          Run-Setup $setup.FullName @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=""') "$env:RUNNER_TEMP\install.log"
          $exe = "$env:ProgramFiles\Relay\relay.exe"
          if (-not (Test-Path $exe)) { throw "relay.exe was not installed" }
          if (-not (Test-Path "$env:ProgramFiles\Relay\relay-desktop.exe")) { throw "relay-desktop.exe was not installed" }
          Write-Host "Installed. Checking version"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "relay.exe --version failed" }
          Write-Host "Checking firewall rule"
          $rule = netsh advfirewall firewall show rule name="Relay (Tailscale only)" verbose | Out-String
          if ($rule -notmatch '100\.64\.0\.0/10') { throw "firewall rule missing or not limited to Tailscale: $rule" }
          if ($rule -notmatch 'relay-desktop\.exe') { throw "firewall rule for relay-desktop.exe missing: $rule" }
          if ($rule -match 'RemoteIP:\s+Any') { throw "a firewall rule is not limited to Tailscale: $rule" }
          Write-Host "Uninstalling"
          Run-Setup "$env:ProgramFiles\Relay\unins000.exe" @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') "$env:RUNNER_TEMP\uninstall.log"
          # The uninstaller hands off to a temporary copy of itself; give it a moment to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "relay.exe is still installed after uninstall" }
          Write-Host "Smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: RelaySetup-${{ steps.version.outputs.version }}
          path: installer/Output/RelaySetup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/RelaySetup-*.exe
