name: Device host (aarch64 Linux)

# Builds the `relay` server for aarch64 Linux (e.g. a phone running Proot
# Linux) so it can be started as `relay host` and paired with the PC.
# The PC keeps the model, agent loop and history; this binary is only the
# "hands" (file + shell tools) on the device.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - ".github/workflows/host.yml"
  pull_request:
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cross
            server/target
          key: host-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Install cross
        run: |
          # cross provides a full aarch64 build environment (C toolchain + libc
          # headers) in a container, which bare cross-gcc lacks for deps like
          # ring (used by rustls). GitHub runners have Docker.
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz -o cross.tgz
          mkdir -p ~/bin
          tar -xzf cross.tgz --wildcards '*/cross' --strip-components 1 -C ~/bin
          chmod +x ~/bin/cross
          echo "$HOME/bin" >> "$GITHUB_PATH"
          cross --version

      - name: Cross-compile relay for aarch64
        working-directory: server
        run: cross build --release --target aarch64-unknown-linux-gnu

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' server/Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p dist
          cp server/target/aarch64-unknown-linux-gnu/release/relay dist/relay
          cp dev/proot-install.sh dist/install.sh
          chmod +x dist/relay dist/install.sh
          # A tiny launcher so the phone can start it with one line.
          printf '#!/bin/sh\nexec "$(dirname "$0")/relay" host --bind 0.0.0.0:8766 --root "${RELY_ROOT:-$HOME}" "$@"\n' > dist/start
          chmod +x dist/start
          cd dist && zip -q relay-host-aarch64-linux.zip relay install.sh start

      - uses: actions/upload-artifact@v4
        with:
          name: RelayHost-${{ steps.version.outputs.version }}
          path: dist/relay-host-aarch64-linux.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/relay-host-aarch64-linux.zip
